global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: echo-api
    metrics_path: /metrics
    static_configs:
      - targets: ['echo-prod-api-1:9000']
        labels:
          environment: production
      - targets: ['echo-staging-api-1:9000']
        labels:
          environment: staging

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']